name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, test, type-check, and build
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Package exact Obsidian release assets
        run: npm run package:release
      - name: Scan source for secrets
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '(^|/)(node_modules|release-assets)(/|$)|(^|/)main\.js$' . > /tmp/detect-secrets.json
          python - <<'PY'
          import json
          with open("/tmp/detect-secrets.json", encoding="utf-8") as handle:
              report = json.load(handle)
          ignored = (".git/", "node_modules/", "release-assets/", "main.js")
          results = {
              path: items for path, items in report["results"].items()
              if not any(part in path.replace("\\", "/") for part in ignored)
          }
          findings = sum(len(items) for items in results.values())
          if findings:
              for filename, items in sorted(results.items()):
                  for item in items:
                      print(f"{filename}:{item['line_number']}: {item['type']}")
              raise SystemExit(f"detect-secrets found {findings} unresolved result(s)")
          PY
      - name: Verify assets and local Markdown links
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          function pngSize(file) {
            const b = fs.readFileSync(file);
            if (b.toString("hex", 0, 8) !== "89504e470d0a1a0a") throw new Error(`${file} is not PNG`);
            return [b.readUInt32BE(16), b.readUInt32BE(20)];
          }
          if (pngSize("docs/images/dashboard.png").join("x") !== "1280x720") throw new Error("dashboard dimensions");
          if (pngSize("docs/images/social-preview.png").join("x") !== "1280x640") throw new Error("social dimensions");
          if (fs.statSync("docs/images/social-preview.png").size >= 1_000_000) throw new Error("social preview >= 1 MB");
          for (const file of ["demo/favicon.svg", "demo/favicon.ico", "demo/apple-touch-icon.png"]) if (!fs.statSync(file).size) throw new Error(`missing ${file}`);
          const markdown = [];
          function walk(dir) { for (const entry of fs.readdirSync(dir, { withFileTypes: true })) { if ([".git", "node_modules", "release-assets"].includes(entry.name)) continue; const target = path.join(dir, entry.name); entry.isDirectory() ? walk(target) : entry.name.endsWith(".md") && markdown.push(target); } }
          walk(".");
          const missing = [];
          for (const file of markdown) for (const match of fs.readFileSync(file, "utf8").matchAll(/!?\[[^\]]*\]\(([^)]+)\)/g)) { const raw = match[1].trim().split("#", 1)[0]; if (!raw || raw.includes("://") || raw.startsWith("mailto:")) continue; if (!fs.existsSync(path.resolve(path.dirname(file), decodeURIComponent(raw)))) missing.push(`${file}: ${raw}`); }
          if (missing.length) throw new Error(`Missing local links:\n${missing.join("\n")}`);
          NODE

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build hardened static demo image
        run: docker build -t vault-muse-demo:test .
